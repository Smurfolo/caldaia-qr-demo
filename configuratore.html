<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Configuratore manutenzione</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><strong>Caldaia</strong> · area master</div>
    <a class="brand" href="index.html" style="text-decoration:none">← home</a>
  </header>
  <div class="card"><label for="who">Accedi come (login finto)</label><select id="who"></select></div>
  <div id="main"></div>
</div>
<script src="app.js"></script>
<script>
const db = getDb(), who = document.getElementById('who'), main = document.getElementById('main');
db.tecnici.forEach(t => who.add(new Option(`${t.nome} (${t.ruolo}) — ${getCentro(t.centro_id).nome}`, t.id)));
who.value = localStorage.getItem('caldaia_demo_tecnico') || db.tecnici[0].id;
if (!who.value) who.value = db.tecnici[0].id;
who.addEventListener('change', () => { localStorage.setItem('caldaia_demo_tecnico', who.value); load(); });
let piani = [], centroId = null;

function load() {
  const t = db.tecnici.find(x => x.id === who.value);
  if (t.ruolo !== 'master') { main.innerHTML = '<div class="card empty-state">Il configuratore è riservato ai master del centro.</div>'; return; }
  centroId = t.centro_id;
  piani = JSON.parse(JSON.stringify(getCentro(centroId).piani || []));
  draw();
}
function draw() {
  main.innerHTML = `<div class="card"><h1>Piani di manutenzione</h1><p class="lede" style="margin:0">${getCentro(centroId).nome} — fino a 3 configurazioni, visibili agli utenti senza piano.</p></div>` +
    piani.map((p, i) => `<div class="card" data-i="${i}"><label>Nome piano</label><input type="text" data-f="nome" value="${p.nome}">
      <label>Servizi inclusi</label><div class="svc-grid">${SERVIZI.map(s => `<label><input type="checkbox" data-f="srv" value="${s}" ${p.servizi.includes(s) ? 'checked' : ''}>${s}</label>`).join('')}</div>
      <div class="field-row"><div><label>Tempo di risposta</label><select data-f="tempo">${TEMPI.map(t => `<option ${t === p.tempo ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
      <div><label>Prezzo €/anno (vuoto = su richiesta)</label><input type="text" data-f="prezzo" value="${p.prezzo || ''}"></div></div>
      <button class="btn btn-secondary btn-block" data-del="${i}" style="margin-top:14px">Elimina</button></div>`).join('') +
    (piani.length < 3 ? '<button class="btn btn-secondary btn-block" id="add">+ Aggiungi configurazione</button>' : '') +
    '<button class="btn btn-primary btn-block" id="save" style="margin-top:10px">Salva</button><div class="count-hint" id="msg"></div>';
}
main.addEventListener('input', e => {
  const c = e.target.closest('[data-i]'); if (!c) return; const p = piani[c.dataset.i], f = e.target.dataset.f;
  if (f === 'srv') p.servizi = [...c.querySelectorAll('[data-f=srv]:checked')].map(x => x.value);
  else if (f === 'prezzo') p.prezzo = parseInt(e.target.value, 10) || null;
  else if (f) p[f] = e.target.value;
});
main.addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.del !== undefined) { piani.splice(t.dataset.del, 1); draw(); }
  else if (t.id === 'add') { piani.push({ id: 'p' + Date.now(), nome: 'Nuovo piano', servizi: [SERVIZI[0]], tempo: TEMPI[1], prezzo: null }); draw(); }
  else if (t.id === 'save') { salvaPiani(centroId, piani); document.getElementById('msg').textContent = 'Salvato. Gli utenti vedono ora queste offerte.'; }
});
load();
</script>
</body>
</html>
